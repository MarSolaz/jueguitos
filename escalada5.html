<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Climb Screen - Corregido</title>
<style>
    body { margin: 0; overflow: hidden; background: #f0e7df; font-family: 'Segoe UI', sans-serif; }
    canvas { display: block; touch-action: none; margin: 0 auto; }

    /* Estilos del Menú */
    #startOverlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #f0e7df;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        z-index: 100; gap: 20px;
    }
    .menu-group { display: flex; flex-direction: column; gap: 15px; align-items: center; }
    
    /* Botones */
    button {
        padding: 15px 40px; font-size: 18px; font-weight: 200; letter-spacing: 2px;
        color: #3c281e; border: 1px solid #3c281e; background: transparent;
        cursor: pointer; transition: all 0.3s; width: 250px;
        text-transform: uppercase;
    }
    button:hover { background: #3c281e; color: #f0e7df; }
    
    #timeOptions { display: none; flex-direction: column; gap: 10px; }
    
    /* Botón reiniciar al final */
    #restartBtn { 
        margin-top: 20px; 
        border-color: #fff; color: #fff; 
        background: rgba(0,0,0,0.2);
        display: none; /* Oculto por defecto */
    }
    #restartBtn:hover { background: #fff; color: #3c281e; }

    /* Interfaz de Juego (UI) - Oculta al inicio */
    .ingame-ui { opacity: 0; transition: opacity 0.5s; pointer-events: none; }
    .game-active .ingame-ui { opacity: 1; }

    #ui { position: absolute; top: 40px; right: 40px; text-align: right; color: rgba(60,40,30,0.7); z-index: 10; }
    #altitud { font-size: 32px; font-weight: 200; }
    #timerDisplay { font-size: 18px; font-weight: 600; margin-top: 5px; }

    .timer-wrap { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); width: 200px; height: 6px; background: rgba(0,0,0,0.05); border-radius: 10px; }
    #timer-fill { height: 100%; width: 0%; background: #b35a3c; border-radius: 10px; }
    
    /* Mensajes y contenedor final */
    #endGameContainer {
        position: absolute; top: 100px; left: 50%; transform: translateX(-50%);
        display: flex; flex-direction: column; align-items: center;
        z-index: 20; text-align: center; pointer-events: none;
    }
    #msg { 
        font-size: 28px; font-weight: 600; color: #fff; 
        text-shadow: 0 0 10px rgba(0,0,0,0.4); 
        transition: opacity 0.5s;
        white-space: pre-wrap; /* Para saltos de línea */
    }
    
    /* Icono Música */
    #musicIcon { position: absolute; top: 40px; left: 40px; width: 40px; height: 40px; background: rgba(255,255,255,0.3); border-radius: 50%; display:flex;align-items:center;justify-content:center;cursor:pointer; z-index: 10; }
    #musicIcon::after { content: '♫'; font-size: 20px; color:#3c281e; }
</style>
</head>
<body>

<div id="startOverlay">
    <div id="mainMenu" class="menu-group">
        <button onclick="preStartGame('free')">ESCALADA LIBRE</button>
        <button onclick="showTimeOptions()">POR TIEMPO</button>
    </div>
    <div id="timeOptions" class="menu-group">
        <button onclick="preStartGame('timed', 1)">1 MINUTO</button>
        <button onclick="preStartGame('timed', 3)">3 MINUTOS</button>
        <button onclick="preStartGame('timed', 5)">5 MINUTOS</button>
        <button onclick="backToMain()" style="border:none; font-size: 12px; width: auto; padding: 5px;">ATRÁS</button>
    </div>
</div>

<div id="ui" class="ingame-ui">
    <div id="altitud">0m</div>
    <div id="timerDisplay"></div>
</div>

<div class="timer-wrap ingame-ui"><div id="timer-fill"></div></div>

<div id="endGameContainer">
    <div id="msg"></div>
    <button id="restartBtn" onclick="resetToMenu()">VOLVER AL INICIO</button>
</div>

<div id="musicIcon"></div>
<audio id="bgMusic" src="andino.mp3" loop></audio>
<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const timerFill = document.getElementById('timer-fill');
const msgDiv = document.getElementById('msg');
const restartBtn = document.getElementById('restartBtn');
const endGameContainer = document.getElementById('endGameContainer');
const bgMusic = document.getElementById('bgMusic');
const musicIcon = document.getElementById('musicIcon');
const startOverlay = document.getElementById('startOverlay');
const timerDisplay = document.getElementById('timerDisplay');

let gameStarted = false;
let gameMode = 'free'; 
let timeLimit = 0; 
let startTime = 0;
let gameOver = false;

// Variables de estado del juego (necesarias para reiniciar)
let cameraY, timeCycle, lastJumpTime, progressCount, ledgesTouched;
let checkpoints, player, ledges, rockPoints, clouds, birds, lastBirdSpawn;

// Configuración de Colores (Ciclo de día)
const PALETTE = [
    {sky:'#87CEEB', rockTop:'#b54c2b', rockBase:'#d9956f'},   // Amanecer/Mañana
    {sky:'#f0e7df', rockTop:'#c86a48', rockBase:'#e8b49a'},   // Mediodía
    {sky:'#ff7e5f', rockTop:'#8a331a', rockBase:'#b54c2b'},   // Atardecer
    {sky:'#2c3e50', rockTop:'#1a1a1a', rockBase:'#3c281e'}    // Noche
];

const IMPULSO = 14.5, GRAVEDAD = 0.38;

// --- Funciones de Menú ---

function showTimeOptions() {
    document.getElementById('mainMenu').style.display = 'none';
    document.getElementById('timeOptions').style.display = 'flex';
}

function backToMain() {
    document.getElementById('mainMenu').style.display = 'flex';
    document.getElementById('timeOptions').style.display = 'none';
}

// Inicializa variables y genera el mundo
function initGameData() {
    cameraY=0; 
    timeCycle=0; 
    lastJumpTime=Date.now(); 
    progressCount=0; 
    ledgesTouched=new Set();
    checkpoints=[{x:100,y:580}];
    player={x:100,y:580,vx:0,vy:0,anchorX:100,anchorY:580,state:'hanging',ropeLen:60,angle:-Math.PI/2};
    ledges=[]; 
    rockPoints=[]; 
    clouds=[]; 
    birds=[];
    lastBirdSpawn = Date.now();
    gameOver = false;
    
    // Ocultar elementos finales
    restartBtn.style.display = 'none';
    endGameContainer.style.pointerEvents = 'none';
    msgDiv.style.opacity = 0;
    timerDisplay.innerText = '';

    // Nubes iniciales
    for(let i=0;i<6;i++){ 
        clouds.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, speed:0.2+Math.random()*0.1, size:10+Math.random()*10}); 
    }
    generateChunk(650,60);
}

function preStartGame(mode, mins) {
    gameMode = mode;
    if(mode === 'timed') {
        timeLimit = mins * 60 * 1000;
        startTime = Date.now();
    }
    
    initGameData(); // Preparar datos nuevos
    
    startOverlay.style.display = 'none';
    document.body.classList.add('game-active'); // Mostrar UI
    
    bgMusic.play().catch(e => {});
    gameStarted = true;
    requestAnimationFrame(gameLoop);
}

function resetToMenu() {
    gameStarted = false;
    document.body.classList.remove('game-active'); // Ocultar UI
    startOverlay.style.display = 'flex';
    backToMain(); // Volver a la pantalla principal del menú
    // Dibujar una vez para limpiar el fondo
    timeCycle = 0;
    draw();
}

// --- Lógica del Juego ---

musicIcon.addEventListener('click', () => {
    if(bgMusic.paused){ bgMusic.play(); musicIcon.style.background='rgba(255,255,255,0.3)'; }
    else { bgMusic.pause(); musicIcon.style.background='rgba(255,0,0,0.3)'; }
});

function resize(){ 
    canvas.height = window.innerHeight; 
    canvas.width = Math.min(window.innerWidth, window.innerHeight*(9/16)); 
}
window.addEventListener('resize', resize);
resize();


function generateChunk(startY, blocks){
    for(let i=0;i<blocks;i++){
        let y = startY-(i*35);
        rockPoints.push({y:y, x:180+Math.sin(y/80)*30+Math.random()*20});
        if(y<500 && i%4===0){
            const p=rockPoints[rockPoints.length-1];
            let isFake = (ledges.length < 8) ? false : Math.random()>0.85;
            ledges.push({x:p.x-20, y:y, w:55, fake:isFake, id:Math.random(), broken:false});
            ledges.push({x:p.x-90, y:y-70, w:50, fake:false, id:Math.random(), broken:false});
        }
    }
}

window.addEventListener('mousemove', e => {
    if(!gameStarted || gameOver) return;
    let rect=canvas.getBoundingClientRect();
    player.angle=Math.atan2((e.clientY-rect.top)-(player.y-cameraY),(e.clientX-rect.left)-player.x);
});

// Soporte táctil básico para la dirección
window.addEventListener('touchmove', e => {
    if(!gameStarted || gameOver) return;
    e.preventDefault();
    let rect=canvas.getBoundingClientRect();
    let touch = e.touches[0];
    player.angle=Math.atan2((touch.clientY-rect.top)-(player.y-cameraY),(touch.clientX-rect.left)-player.x);
}, { passive: false });


function lerpColor(a,b,t){
    const parse=c=>({r:parseInt(c.slice(1,3),16),g:parseInt(c.slice(3,5),16),b:parseInt(c.slice(5,7),16)});
    const c1=parse(a),c2=parse(b);
    return `rgb(${Math.round(c1.r+(c2.r-c1.r)*t)},${Math.round(c1.g+(c2.g-c1.g)*t)},${Math.round(c1.b+(c2.b-c1.b)*t)})`;
}

function showMsg(text, persistent = false){
    msgDiv.innerText=text; msgDiv.style.opacity=1;
    if(!persistent) setTimeout(()=>{ if(!gameOver) msgDiv.style.opacity=0; },1200);
}

function update(){
    if(!gameStarted || gameOver) return;
    
    let now=Date.now();

    // --- Manejo de tiempo y ciclo de luz ---
    if(gameMode === 'timed') {
        let remaining = timeLimit - (now - startTime);
        if(remaining <= 0) {
            gameOver = true;
            let finalMetros = Math.max(0,Math.floor(-player.y/10+58));
            showMsg(`¡TIEMPO AGOTADO!\nEscalaste ${finalMetros}m`, true);
            
            // Mostrar botón de reiniciar
            restartBtn.style.display = 'inline-block';
            endGameContainer.style.pointerEvents = 'auto'; // Permitir clicks
            return;
        }
        // Ajustar ciclo de luz al tiempo límite
        timeCycle = (now - startTime) / timeLimit * (PALETTE.length - 0.01);
        
        let segs = Math.ceil(remaining/1000);
        timerDisplay.innerText = `${Math.floor(segs/60)}:${(segs%60).toString().padStart(2,'0')}`;
    } else {
        // Modo Libre: Ciclo de día notable (aprox cada 2.5 minutos)
        timeCycle = (now % 150000) / 150000 * PALETTE.length; 
    }

    // --- Física y Control ---
    let elapsed=now-lastJumpTime;
    if(elapsed>3000 && player.state==='hanging'){
        player.state='jumping';
        player.vx=Math.cos(player.angle)*IMPULSO;
        player.vy=Math.sin(player.angle)*IMPULSO;
        lastJumpTime=now;
    }
    timerFill.style.width=Math.min(100,(elapsed/3000*100))+"%";

    if(player.state==='hanging'){
        let osc=Math.sin(now*0.0015)*0.2;
        player.x=player.anchorX+Math.sin(osc)*player.ropeLen;
        player.y=player.anchorY+Math.cos(osc)*player.ropeLen;
    } else {
        player.vy+=GRAVEDAD;
        player.x+=player.vx; player.y+=player.vy;
        ledges.forEach(l=>{
            if(!l.broken && player.vy>0 && player.x>l.x-10 && player.x<l.x+l.w+10 && Math.abs(player.y-l.y)<20){
                if(l.fake){ l.broken=true; player.state='falling'; showMsg('¡Paso en falso!'); }
                else{
                    player.state='hanging'; player.anchorX=player.x; player.anchorY=l.y;
                    player.vx=0; player.vy=0;
                    if(!ledgesTouched.has(l.id)){
                        ledgesTouched.add(l.id); progressCount++;
                        if(progressCount>=3){ checkpoints.push({x:player.x,y:l.y}); progressCount=0; showMsg('¡Puesto seguro!'); }
                    }
                }
            }
        });
    }

    // Caída al checkpoint
    let safe=checkpoints[checkpoints.length-1];
    if(player.y>safe.y+600){
        player.state='hanging'; player.anchorX=safe.x; player.anchorY=safe.y;
        player.x=safe.x; player.y=safe.y+player.ropeLen;
        player.vx=0; player.vy=0; lastJumpTime=now;
    }

    // Cámara y Altitud
    cameraY+=(player.y-canvas.height/1.6-cameraY)*0.05;
    document.getElementById('altitud').innerText=`${Math.max(0,Math.floor(-player.y/10+58))}m`;
    
    // Generación infinita
    if(rockPoints.length > 0 && rockPoints[rockPoints.length-1].y > cameraY-1500) generateChunk(rockPoints[rockPoints.length-1].y-35,40);

    // Ambiente
    clouds.forEach(c => { c.x += c.speed; if(c.x > canvas.width + 50) c.x = -50; });

    if(now - lastBirdSpawn > 5000){ 
        birds.push({x: -30, y: cameraY + (Math.random() * canvas.height), speed: 0.8 + Math.random() * 0.7, wing: 0}); 
        lastBirdSpawn = now; 
    }
    birds.forEach((b,i)=>{ b.x += b.speed; b.wing = Math.sin(now * 0.01) * 5; if(b.x > canvas.width + 40) birds.splice(i,1); });
}

function draw(){
    if(!rockPoints || rockPoints.length === 0) {
         ctx.fillStyle='#f0e7df'; ctx.fillRect(0,0,canvas.width,canvas.height);
         return;
    }

    let stateIdx=Math.floor(timeCycle % PALETTE.length);
    let nextIdx=(stateIdx+1)%PALETTE.length;
    let t=timeCycle % 1;
    
    // Interpolación de colores
    let curSky=lerpColor(PALETTE[stateIdx].sky, PALETTE[nextIdx].sky, t);
    let curRockTop=lerpColor(PALETTE[stateIdx].rockTop, PALETTE[nextIdx].rockTop, t);
    let curRockBase=lerpColor(PALETTE[stateIdx].rockBase, PALETTE[nextIdx].rockBase, t);

    // Cielo
    ctx.fillStyle=curSky;
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // Nubes
    clouds.forEach(c=>{
        ctx.fillStyle= (stateIdx === 3) ? 'rgba(200,200,255,0.15)' : 'rgba(255,255,255,0.6)';
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.size*1.2, 0, Math.PI*2);
        ctx.arc(c.x+c.size*0.8, c.y+5, c.size, 0, Math.PI*2);
        ctx.arc(c.x-c.size*0.8, c.y+5, c.size*0.9, 0, Math.PI*2);
        ctx.fill();
    });

    ctx.save();
    ctx.translate(0,-cameraY);

    // Montaña
    ctx.beginPath(); ctx.moveTo(0,cameraY+canvas.height+100);
    rockPoints.forEach(p=>{ if(p.y>cameraY-800 && p.y<cameraY+canvas.height+800) ctx.lineTo(p.x,p.y); });
    ctx.lineTo(0,cameraY-800);
    let grad=ctx.createLinearGradient(0,cameraY-800,0,cameraY+canvas.height+400);
    grad.addColorStop(0, curRockTop); 
    grad.addColorStop(1, curRockBase);
    ctx.fillStyle=grad; ctx.fill();

    // Salientes
    ledges.forEach(l=>{
        if(l.y<cameraY-100||l.y>cameraY+canvas.height+100||l.broken) return;
        ctx.fillStyle="rgba(0,0,0,0.1)"; ctx.fillRect(l.x-5,l.y+5,l.w+10,10);
        ctx.fillStyle="rgba(0,0,0,0.2)"; ctx.fillRect(l.x,l.y,l.w,8);
    });

    // Checkpoints anteriores
    ctx.strokeStyle="rgba(0,0,0,0.15)"; ctx.lineWidth=2; ctx.setLineDash([5,5]);
    ctx.beginPath(); ctx.moveTo(checkpoints[0].x, checkpoints[0].y);
    checkpoints.forEach(cp => ctx.lineTo(cp.x, cp.y));
    ctx.lineTo(player.anchorX, player.anchorY); ctx.stroke(); ctx.setLineDash([]);

    checkpoints.forEach(cp=>{
        ctx.fillStyle="rgba(0,0,0,0.3)";
        ctx.fillRect(cp.x-2, cp.y-10, 4, 12);
        ctx.beginPath(); ctx.arc(cp.x, cp.y-10, 3, 0, Math.PI*2); ctx.fill();
    });

    // Cuerda actual
    ctx.strokeStyle=(stateIdx === 3) ? "rgba(255,255,255,0.3)" : "rgba(255,255,255,0.6)"; 
    ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(player.anchorX,player.anchorY); ctx.lineTo(player.x,player.y-18); ctx.stroke();

    // Guía de salto
    if(player.state==='hanging' && !gameOver && gameStarted){
        ctx.strokeStyle="rgba(255,255,255,0.3)"; ctx.setLineDash([5,10]);
        ctx.beginPath(); ctx.moveTo(player.x, player.y-18);
        ctx.lineTo(player.x+Math.cos(player.angle)*100, player.y-18+Math.sin(player.angle)*100);
        ctx.stroke(); ctx.setLineDash([]);
    }

    // Jugador
    ctx.fillStyle=(stateIdx === 3) ? "#6e5a4e" : "#3c281e";
    ctx.beginPath(); ctx.arc(player.x,player.y-24,6,0,Math.PI*2); ctx.fill();
    ctx.fillRect(player.x-5,player.y-20,10,18);

    // Aves
    birds.forEach(b=>{
        ctx.strokeStyle=(stateIdx === 3) ? '#000' : '#444'; ctx.lineWidth=1.2;
        ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x+6, b.y-3+b.wing); ctx.lineTo(b.x+12, b.y); ctx.stroke();
    });

    ctx.restore();
}

function gameLoop(){
    update();
    draw();
    if(gameStarted) requestAnimationFrame(gameLoop);
}

// Dibujo inicial del fondo
initGameData(); 
draw();
</script>
</body>
</html>
